plugins { id 'com.android.application' }
android {
 namespace 'net.ccbcm.wallpaper'
 compileSdk 35
 defaultConfig { applicationId 'net.ccbcm.wallpaper.preview'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4' }
 signingConfigs {
  release {
   storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: 'missing-release.p12')
   storePassword System.getenv('ANDROID_STORE_PASSWORD')
   keyAlias 'ccbcm'
   keyPassword System.getenv('ANDROID_STORE_PASSWORD')
   storeType 'PKCS12'
  }
 }
 buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies { implementation 'androidx.media3:media3-exoplayer:1.8.0'; implementation 'androidx.core:core:1.15.0' }
