name: Android preview
on:
  workflow_dispatch:
  push:
    paths: ['mobile/android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p mobile/android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CCBCM-Android-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
