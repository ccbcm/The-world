name: Android preview
on:
  workflow_dispatch:
  push:
    paths: ['mobile/android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing identity
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ccbcm-release.p12"
      - run: gradle -p mobile/android assembleRelease lintRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ccbcm-release.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: CCBCM-Android-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
